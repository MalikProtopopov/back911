events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Backend API configuration - TEMPORARY HTTP ONLY (for SSL certificate acquisition)
    server {
        listen 80;
        server_name api.sluzhba911.com;
        
        # Let's Encrypt challenge - required for certbot
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # CORS headers
        add_header Access-Control-Allow-Origin "https://sluzhba911.com" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
        add_header Access-Control-Allow-Credentials "true" always;

        # Handle preflight requests
        if ($request_method = OPTIONS) {
            return 204;
        }

        # Increase body size limit for API requests
        client_max_body_size 10M;

        # Proxy to backend
        location / {
            proxy_pass http://web:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            
            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Health check
        location /health {
            access_log off;
            proxy_pass http://web:8000/health;
        }
        
        # Static files
        location /static/ {
            alias /app/static/;
        }
        
        # Media files
        location /media/ {
            alias /app/media/;
        }
    }
}
