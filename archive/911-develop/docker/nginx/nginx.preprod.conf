map $http_upgrade $connection_upgrade {
    default upgrade;
     '' close;
}

upstream backend {
    server backend:8888;
}

server {
    listen 80;
    server_name api.911.mediann.dev;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://api.911.mediann.dev$request_uri;
    }
}


server {
    listen 443                      ssl;
	  root                    /front/dist;
    index                    index.html;

    server_name api.911.mediann.dev;

    client_max_body_size 50M;

    ssl_certificate /etc/letsencrypt/live/api.911.mediann.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.911.mediann.dev/privkey.pem;

    location / {
      proxy_pass http://backend;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;

      proxy_redirect     off;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Host $server_name;
    }

    location /ws/ {
      proxy_pass http://backend;
      proxy_http_version 1.1;
      proxy_set_header Connection $http_connection;
      proxy_set_header Upgrade $http_upgrade;
      proxy_redirect     off;
    }

    location /static/ {
      alias /static/;
      client_max_body_size 50M;
      autoindex off;
    }

    location ~* /media/.*?\.(html|txt|jpg|jpeg|gif|png|pdf|ico|css|bmp|js|swf|otf|woff|ttf|gz|svg|ogg)$ {
      alias /media/;
      expires 30m;
      add_header Cache-Control public;
    }
}
